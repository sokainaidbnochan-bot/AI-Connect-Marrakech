<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI Connect Marrakech{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="mark">AC</span>
      <span class="word">AI Connect<span class="sub">Marrakech</span></span>
    </div>
    <a class="nav-item {% if active == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Tableau de bord</a>
    <a class="nav-item {% if active == 'entreprises' %}active{% endif %}" href="{{ url_for('entreprises') }}">Entreprises</a>
    <a class="nav-item {% if active == 'carte' %}active{% endif %}" href="{{ url_for('carte') }}">Carte</a>
    <a class="nav-item {% if active == 'suivi' %}active{% endif %}" href="{{ url_for('suivi') }}">Suivi</a>
  
  </aside>

  <main>
    {% block content %}{% endblock %}
  </main>

</div>
</body>
</html>
